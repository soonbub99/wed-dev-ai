<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가위바위보 게임</title>
    <style>
      li {
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h1>가위바위보 게임</h1>
    <ul>
      <li>컴퓨터는 랜덤으로 가위/바위/보 중 하나를 선택</li>
      <li>사용자는 가위/바위/보 중 하나를 입력</li>
      <li>취소 버튼을 눌러서 게임 종료 시 승/무/패 결과 출력</li>
      <li>
        처음부터 객체 방식으로 구현해도 좋고, 일단 구현하고 객체 방식으로 리팩토링해도 좋음
        <ul>
          <li>
            객체는 사용자(<code>player</code>), 
            컴퓨터(<code>computer</code>),
            게임(<code>game</code>)으로 나눌 수 있음
          </li>
        </ul>
      </li>
    </ul>
    <script src="./practice05-object.js"></script>
  </body>
</html>
