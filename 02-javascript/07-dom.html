<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>DOM(Document Object Model)</h1>

    <h2>문서 객체 가져오기</h2>
    <div id="testId" class="testClass" name="testName">Hello, World!</div>
    <div id="testId2" class="testClass" name="testName">Hello, javaScript!</div>

    <h2>문서 객체 조작하기</h2>
    <h3>텍스트 출력</h3>
    <div id="result1"></div>
    <button onclick="printText()">출력하기</button>

    <h3><input 값 축력"></h3>
    <div id="result2"></div>
    <input type="text" id="customer" placeholder="이름을 입력해주세요"/>
    <button onclick="printInputValue()">출력하기</button>

    <h3>문자열 길이 출력</h3>
    <input type = "text" id="text" placeholder="="글자를 입력해주세요" />
    <div id="result3"></div>
    <button onclick="stringLenguth()">확인</button>

    <h3>div 색상 변경</h3>
    <style>
        .div-test{
            width: 100px;
            height: 100px;
            background-color: black;
            margin-bottom: 10px;
        }
        .active{
            background-color: black;
            color: white;
        }
    </style>
     <div class="div-test" id="colorBox"></div>
     <button onclick="changeColor()">색상 변경</button>

     <h3>클래스 토글</h3>
     <style>
     .toggle{
        background-color:orange;
     }
     </style>
     <div class="div-test" id="result4"></div>
     <button onclick="toggleClass()">클래스 추가/삭제</button>

     <h2>문서 객체 추가/삭제</h2>
     <div id="testId3"></div>

     <h3>문자열 분리 u1 출력</h3>
     <label for="la">사과, 바나나, 오렌지, 포도</label>
     <div id="result5"></div>
     <button onclick="stringSplit()">출력</button>

     <h3>li 요소 추가 & 삭제</h3>
     <ul id="list"></ul>
     <button onclick="addItem()">아이템 추가</button>
     <button onclick="removeItem()">아이템 삭제</button>

    <script src="./07-dom.js"></script>
</body>
</html>
