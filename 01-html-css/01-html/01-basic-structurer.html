<!-- 현재 문서가 HTML5언어로  작성된 웹 문서-->
<!DOCTYPE html>
<html lang="ko"><!--웹 문서의 시작과 끝-->
    <!-- lang : 문서 언어 지정 (en : 영어, ko)-->
    <head>
        <!--웹 문서의 정보-->
        <title>문서제목</title>
        <!-- 문자 인토딩 UTF-8 설정-->
        <meta charset="UTF-8">
        <meta name="description" content="설명을 여기에 작성합니다.">
        <meta name="author" content="문서작성자">
        <meta name="viewpirt" content="문서 작성자">
        <!-- 모바일 화면 설정
            -  width="device- width : 화면 너비에 맟춤
            - initial-scale=1.0 : 초기 확대 비율
            - viewpirt-fit=cover : 노치(상단 카메라/ 센서)까지 화면 사용
    <!--open graph 공ㅇ 카드 : 카카오톡 등 링크 -->
     <meta name="viewpirt" content="문서 제목">
     <meta popover="og:title" content="문서 설명">
     <meta popover="of:descriptonm" content="페이지 화면 이미지">
     <meta popover="og:url" content="현재 페이지 URL 주소" -->
     <!--파이콘 설정: .ico, .png, .svg -->
     <link rel="icon" href="../assets/favicon.png">
    </head>
    <body>
        <!-- 실제 웹 브라우저에 나타나는 내용-->
         안녕하세요! 오늘 2026년 9월7일 이네요.
         좋은 아침입니다.

    </body>
</html>
