<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시맨틱 태그</title>

</head>
<body>
    <h2>시맨틱 태그</h2>
    <!-- 시맨특 태그를 사용하는 이유" 웹 접근성 + SEO
         - 웹 접근성 : 눈으로 직접 보지 않고 어떤 기기든 환경에서 든 누구나 콘테츠를 쓸 수 있도록
         - SEO : 검색엔진(구글,네이버)이 내 페이지를 이해할 수 있도록(최적화를 위해)
         header : 머리말, nav : 메뉴 묶음
          -->
    <header>
         <h1>LOGO</h1>
        <nav>GNB</nav>
    </header>
       
        <!-- main ; 핵심 본문 (페이지당 딱 1개)-->
    </div>
    <div id="main"></div>
    <main>
        <!-- section/article : 주제별 구획 -->
        <section></section>
        <article></article>
        <div id="" class=""></div>
    </main>
    <!-- aside : 본문에서 벗어난 내용(사이드바- 광고) -->
    <aside></aside>
    <!-- footer : 회사소개, copyright -->
    <footer>
        <!-- 연락처(이메일,주소,전화번호) -->
        <address></address>
    </footer>

</body>
</html>
