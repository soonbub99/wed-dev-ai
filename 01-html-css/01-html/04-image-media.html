<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>멀티미디어 태그</title>
  </head>
  <body>
    <h2>이미지 태그 : img</h2>
    <!--
    src: 이미지 경로
    alt : 대체 텍스트
    - 이미지가 안 뜰 때 대신 보임
    - 스크린리더(시각장애인)가 이걸 읽어줌
    width/height:크기
    loading : 로딩 방식 (기본값 : eaget, lazy)
    - lazy : 이미지를 늦게 로딩
    -->
    <figure>
      <img src="../assets/panda.png" alt="판다" width="200" />
      <figure>넷재 판다</figure>
    </figure>
    <h2>오디오 태그</h2>
    <!-- controls : 재생 컨트롤 표시, loop : 반복 재생 -->
    <audio src="../assets/audio.mp3" controls loop></audio>
    <h2>비디오 태그</h2>
    <video src="../assets/video.mp4" controls></video>


  </body>
</html>
