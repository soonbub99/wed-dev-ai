<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>텍스트 태그</title>
  </head>
  <body>
    <!--제목 태그 : h1~h6
    숫자가 작을수록 글씨 크기가 크고.
    숫자가 커질수록 글씨 크기가 작아진다.
    -->
    <h1>Heading 1</h1>
    <!-- h1은 한 페이지에 한 번만 -->
    <h2>Hending 2</h2>
    <h3>Hending 7</h3>

    <!-- 문단 태그 : 문장을 묶어서 보여줄 때 사용 -->
    <p>p 태그는  문단을 구분한다. <br >
        줄 바꿈이 필요하면 br 태그를 사용한다</p>
    <hr> 
    <!-- 구분선 : 문단이나 섹션을 시각적으로 나눌 때 사용 -->
     <p>
        <strong>중요한 내용</strong>은 중요한 내용은 strong으로 강조하고,
         <br/>
         <em>강조된 내용</em> 강조된 내용은 em으로 표시한다.
     </p>
     <p>
        <mark>강조펴시</mark>강조표시, <small>작은글자</small>, <br >
        H,<sub>2</sub>O와 2,<sub>3</sub>처럼 첨자를 쓸 수 있다.

     </p>
     <!-- 인용 태그 -blockquote 문단인용, cote에 출처 URL
                    -  q 짧은 인용- 따움표에 자동 -->
    <blockquote cite="https://google.com">
        시맨틱 HTML</blockquote><q>은 화면에 어떻게 보이는지가 아니라,
             그내용이 무엇인지를 나타낸다.<br>
        <cite>- Google</cite>
    </blockquote>
    <!-- code : 코드 조가, pre : 입력한 공백 , 줄바꿈-->
    <pre><code><console class="log"('hello,')'
        console.log('worod!'console></code></pre>
        <p><abbr title="Hyper Text Markup Language">HTML</abbr> 을  배우는 중이다.</p>
    <!-- 특수문자 :  < : &lt;, > : &gt;
     &copy; : copyrigyt, &nbsp; : 공백 하나 -->
     <p>a &lt b, a &gt b<br />
      &copy;2026</p>
     
     

  </body>
</html>
