<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>목록 태그</title>
  </head>
  <body>
    <h2>ul(unordered list) : 순서 없는 목록</h2>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
    <h2>ol(ordered list): 순서 있는 목록</h2>
    <ol type="A">
      <li>기획</li>
      <li>디자인</li>
      <li>개발</li>
    </ol>
     <ul>
      <li>HTML</li>
      <ul>
        <li>텍스트 태그</li>
        <li>목록 태그</li>
        <ul>
            <li>시작</li>
            <li>끝</li>
        </ul>
      </ul>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
    <h2>dl : 정의 목록, dt : 용어, dd : 설명</h2>
    <dl>HTML
    <dd>웹 문서를 작성히기 위한 마크업 언어    
    </dd>
    </dl>
  </body>
</html>
