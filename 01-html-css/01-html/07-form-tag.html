<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폼 태그</title>
  </head>
  <ㄹ>
    <h2>기본 품</h2>
    <!-- form : 입력칸들을 묶어서 한 번에 보내는 영역 
     - action : 입력값들을 보낼 주소(서버)
     - method : 어떻게 보낼지(gat/post) -->
     <!-- method="get"인 경우
      입력값이 URL 뒤에 붙어서 전송 -> ?keyword
      -->
    <form action="" method="get">
        <!-- placeholder : 입력 전 흐리게 보이는 안내 문구
         name : 서버로 보낼 때의  "키"
         label 태그의 for 속성 값이랑
         input 태그의 id 속성 값이 같으면 연결
          -->
         <label for="search">검색</label>
      <input id="search" type="text" name="keyword" placeholder="키워드를 입력해주세요" />
      <!-- type = "submit" 품 전송버튼
       - value는 버튼에 보이는 글자 -->
      <input type="submit" value="검색" />
    </form>
    <h2>회원가입</h2>
    <!-- method= "post"인 경우
     URL에 안 보이고 본문에 담아서 전송 (개발자 도구- network)
     -->
    <form action="" method="post">
        <!-- required : 필수 입력 -->

    아이디 <input name="id" type="text" required /><br />
    <!-- minldngth : 최소 글자 수, maxlenght : 최대 글자 수 -->
    비밀번호 <input name="password" type="password" minlength="8"><br />
    <!-- type 입력하는 걸 추천 : subnit(전송), reset(최기화), button (JS용)-->
   <button type="submit">회원가입</button>
   <button type="reset">초기화</button>
   <button type="button" onclick="alert('확인!')">알람창</button>
</form>

<h2>선택 입력</h2>
<form action="">
    <!-- fieldset : 입력 묶음, legend : 묶음의 제목
     -name 값이 같아야 같은 그룹으로 인식 -->
    <label>
        <legend>성별</legend>
        <input type="radio" id="male" name="gemder" value="M"
        <label for="male"> 남자</label>
        <label></label><input type="radio" name="gender"/> 여자</label>

       </fieldset>
       <fieldset>
        <legend>취미</legend>
        <!--checkbox : 여러 개 동시에 선택 가능-->
        <label> <input type="checkbox" name="hobby" value="music"/>으악</label>
        <label><input type="checkbox" name="hobby" value="game"/>게임</label>
       </fieldset>
       <button type="submit">전송</button>
       <h2>선택 목록과 여러 줄 입력</h2>
       <form action="">
        국적
        <!-- select + option : 목록에서 하나 고르기
         - disabled : 선택하지 못하게 막음
         - selected : 처음에는 보임 -->
        <select name="national">
            <option disabled selected>선택해주세요</option>
            <option value="한국">한국</option>
            <option value="일본">일본</option>
            <option value="중국">중국</option>
        </select>
        <button type="submit">전송</button>
        <br />
        메모
        <!-- textarea : 여러 줄 입력 -->
        <textarea name="momo"></textarea>
        <button type="submit">전송</button>
       </form>

       <h2>파일 업로드</h2>
       <form action="">
        <!-- accept = "image/*" : 이미지 파일만 
         multiple : 여러 개 선택 
         .png, .jag 등 개별 선택 가능-->
        <input type="file" accept=".png,.jpg" multiple />
        <button type="submit">전송</button>
       </form>

</form>
       <h2>추가 입력 타입</h2>
       <!-- type만 바꾸면 브라우저가 알맞은 UI 자동으로 바꿈 -->
        <form action="">
           이메일 <input type="email" required /><br />
           전화번호 <input type="tel" required /><br />
           날짜<input type="date" /><br />
           시간 <input type="time" /><br />
           색상<input type="color" /><br />
           슬라이더<input type="range" min="0" max="10" />
           <button type="submit">전송</button>
        
        </form>
  </body>
</html>
