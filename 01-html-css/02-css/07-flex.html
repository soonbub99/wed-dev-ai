<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexbox</title>
    <link rel="stylesheet" href="./07-flex.css" />
  </head>
  <body>
    <h2>display:flex- 부모에 한 줄</h2>
    <div class="container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
    <h2>flex-direction: 주축 방향</h2>
    <div class="container column">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
    <h2>justify-content(주축)/align-items(교차축)</h2>
    <div class="container align">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
    <h2>flex-wrap- 줄바꿈</h2>
    <div class="container wrap">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
    <h2>gap-아이템 사이 간격</h2>
    <div class="container gap">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>

    <h2>flex-grow : 남는 공간 나눠 갖기</h2>
     <div class="container">
      <div class="item grow-1">1</div>
      <div class="item grow-2">2</div>
      <div class="item grow-3">3</div>
    </div>

    <h2>flex-shrink: 공간 부족하면 주어드는 비율</h2>
     <div>class="container shrink">
      <div class="item shrink-0">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>

    <h2>flex:grow shrink</h2>
     <div class="container flex">
      <div class="item flex-1">1</div>
      <div class="item flex-1">2</div>
      <div class="item flex-1">3</div>
    </div>
    <h2>order/akign-self</h2>
    <div class="container">
      <div class="item flex">1</div>
      <div class="item flex self">2</div>
      <div class="item flex order">3</div>
    </div>
  </body>
</html>
