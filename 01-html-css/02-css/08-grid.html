<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <link rel="stylesheet" href="08-grid.css" />
  </head>
  <body>
    <h1>grid</h1>
    <p>display:grid</p>
    <p>2단 레이아웃 스타일</p>
    <h2>gid-template-columns/rows</h2>
    <div class="grid template">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>

    <h2>grid-columns/grid-rows</h2>
    <div class="grid cr">
      <div class="item column">1</div>
      <div class="item row">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>

    <h2>grid-gemplae-areas</h2>
    <div class="grid area">
      <div class="item header">header</div>
      <div class="item nav">nav</div>
      <div class="item main">main</div>
      <div class="item section">section</div>
      <div class="item tootter">footter</div>
    </div>

    <h2>auto-fit / auto-fill</h2>
    <div class="grid fit">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
    <div class="grid fill">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>

    <h2>align-items/ fustify-content</h2>
    <div class="grid items">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
    <div class="grid content">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
  </body>
</html>
